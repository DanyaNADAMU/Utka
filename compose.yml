name: nadamudash
services:
  nadamudash:
    image: ghcr.io/danyanadamu/nadamudash:latest
    container_name: nadamudash
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-127.0.0.1:3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - WORKER_URL=http://nadamudash-worker:8007
      - SUB_URL=http://nadamudash-sub:8008
      - SUB_INTERNAL_URL=http://nadamudash-sub:8008
    volumes:
      - ./xray:/app/xray
    depends_on:
      postgres:
        condition: service_healthy
      nadamudash-worker:
        condition: service_started
      nadamudash-sub:
        condition: service_started

  nadamudash-worker:
    image: ghcr.io/danyanadamu/nadamudash:latest
    container_name: nadamudash-worker
    command: ["/app/start-worker.sh"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - WORKER_PORT=8007
    volumes:
      - ./xray:/app/xray
    depends_on:
      postgres:
        condition: service_healthy

  nadamudash-sub:
    image: ghcr.io/danyanadamu/nadamudash:latest
    container_name: nadamudash-sub
    command: ["/app/start-sub.sh"]
    restart: unless-stopped
    ports:
      - "${SUB_PORT:-127.0.0.1:8008}:8008"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SUB_PORT=8008
      - SUB_HOST=0.0.0.0
    volumes:
      - ./xray:/app/xray
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: nadamudash-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nadamu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nadamu_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-nadamu_db}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nadamu} -d ${POSTGRES_DB:-nadamu_db}"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 1s

  subconverter:
    image: metacubex/subconverter:latest
    container_name: nadamudash-subconverter
    restart: unless-stopped
    volumes:
      - ./xray:/base/xray
