services:
  nadamudash:
    image: ghcr.io/danyanadamu/nadamudash:latest
    container_name: nadamudash
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-127.0.0.1:3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./xray:/app/xray
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: nadamudash-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nadamu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nadamu_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-nadamu_db}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nadamu} -d ${POSTGRES_DB:-nadamu_db}"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 1s

  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: nadamudash-xray
    restart: unless-stopped
    network_mode: "host"
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - ./xray:/etc/xray

  subconverter:
    image: tindy2013/subconverter:latest
    container_name: nadamudash-subconverter
    restart: unless-stopped
