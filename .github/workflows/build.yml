name: Build & Staging Deploy

# Trunk pipeline: every push to main or a feature branch scans secrets,
# lints scripts/Dockerfile, runs the test suite, builds the container
# image through the shared catalog, signs Sigstore provenance, and, on
# feature branches only, rolls it out to the staging testbed. Production
# releases run from release.yml on signed tags.
on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    # Documentation-only pushes skip the pipeline: no image content can
    # change, so the build and the staging roll they would trigger are
    # pure runner cost.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  # Same-branch pushes queue, the newest pending run supersedes older
  # ones, but a running deploy is NEVER cancelled mid-roll: the wrapper
  # owns capture/rollback atomically and a half-cut deploy is exactly
  # what it exists to prevent.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        # Push protection guards only the future; the git timeline is
        # append-only, so anything leaked before the flips can only be
        # discovered, never silently removed. Full history, every push.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          curl -sfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact .

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Shellcheck (entrypoint + scripts)
        env:
          LC_ALL: C.UTF-8
        run: shellcheck entrypoint.sh scripts/*.sh

      - name: Hadolint (Dockerfile)
        env:
          HADOLINT_VERSION: '2.15.1'
        run: |
          set -euo pipefail
          curl -sfL "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint
          hadolint Dockerfile

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Test suite (lint, tsc, vitest, build)
        uses: ./.github/actions/test

  build:
    needs: [gitleaks, lint, test]
    # Single canonical build path from the shared catalog: lowercase GHCR
    # name, layer cache, provenance + SBOM, Trivy severity gate.
    permissions:
      contents: read
      packages: write
    uses: Danyanadamu/Workflows/.github/workflows/container-build.yml@v1
    with:
      context: .
      file: ./Dockerfile
      image_tag: ${{ github.sha }}
      # PR builds are verification-only: no push, so a draft PR can
      # never move the tags the staging testbed pins.
      push: ${{ github.event_name != 'pull_request' }}

  attest:
    needs: build
    # PR verification builds push nothing, so there is no subject to sign.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The signing right lives on the caller's own job: id-token grants
    # never cross a `uses:` boundary, so the catalog cannot sign for us.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Sign build provenance (Sigstore, runner OIDC)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/danyanadamu/utka
          subject-digest: ${{ needs.build.outputs.image_digest }}

  staging-deploy:
    needs: [build, attest]
    # Feature/fix branches deploy to staging (test.nada.mu) for validation;
    # main is released to production via signed tags in release.yml.
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    permissions:
      contents: read
      attestations: read
    uses: Danyanadamu/Workflows/.github/workflows/deploy.yml@v1
    with:
      host: ${{ vars.STAGING_HOST }}
      port: ${{ vars.STAGING_PORT }}
      user: apps
      image: ${{ needs.build.outputs.image_ref }}
    secrets:
      deploy_key: ${{ secrets.STAGING_DEPLOY_KEY }}
      host_key: ${{ secrets.STAGING_DEPLOY_HOST_KEY }}
