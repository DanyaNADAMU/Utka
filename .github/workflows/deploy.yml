name: Deploy Next.js to Server

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: danyanadamu/nadamudash

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (to copy compose.yml)
        uses: actions/checkout@v4

      - name: Copy compose.yml via scp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "compose.yml,xray"
          target: "/opt/stacks/nadamudash/tmp_compose"

      - name: Deploy Next.js to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /opt/stacks/nadamudash
            
            # Use a temporary docker container to copy files to the root-owned xray directory
            # This bypasses the need for sudo if the user doesn't have passwordless sudo
            if [ -d tmp_compose/xray ]; then
              docker run --rm -v $(pwd):/workspace alpine sh -c "mkdir -p /workspace/xray && cp -n /workspace/tmp_compose/xray/* /workspace/xray/ 2>/dev/null || true"
            fi
            
            # Copy compose only if it doesn't exist, to prevent overwriting server config
            if [ ! -f compose.yml ]; then
              mv tmp_compose/compose.yml compose.yml
            fi
            rm -rf tmp_compose
            
            # Ensure .env exists to prevent docker compose errors
            touch .env
            
            docker compose pull
            docker compose up -d
