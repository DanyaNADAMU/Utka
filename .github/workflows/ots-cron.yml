name: OpenTimestamps Daily Upgrade & Verify

# Caller stub: the full oracle logic lives in the public Workflows repo,
# pinned by its signed v1 tag. Public workflows hold zero secrets by design.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  ots:
    # contents: write is the right ots.yml needs to push upgraded proofs
    # back to main; granted here so the caller, not the catalog, owns it.
    permissions:
      contents: write
    uses: Danyanadamu/Workflows/.github/workflows/ots.yml@v1
    secrets:
      btc_getblock_key: ${{ secrets.BTC_GETBLOCK_KEY }}
