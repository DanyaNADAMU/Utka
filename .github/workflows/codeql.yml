name: CodeQL SAST

# Caller stub: first-party CodeQL static analysis lives in the shared
# catalog. TypeScript/JavaScript covers utka-core, utka-sub, utka-web,
# and utka-cli.
on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '15 5 * * 1'
  workflow_dispatch:

jobs:
  sast:
    permissions:
      contents: read
      security-events: write
    uses: Danyanadamu/Workflows/.github/workflows/sast.yml@v1
    with:
      languages: '["javascript-typescript"]'
