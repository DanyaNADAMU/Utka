version: '3.8'

services:
  nadamudash:
    # Имя образа будет передано из GitHub Actions
    image: ${IMAGE_NAME}
    container_name: nadamudash
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # - AUTH_TRUST_HOST=true # Раскомментируйте, если NextAuth ругается на reverse proxy
